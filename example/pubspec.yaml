name: material_charts_example
description: Example app demonstrating Material Charts usage

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  material_charts:
    path: ../ # Points to your main package
  intl: ^0.20.2
  pdf: ^3.11.0
  printing: ^5.13.0
  flutter_svg: ^2.0.10
  path_provider: ^2.1.4
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
